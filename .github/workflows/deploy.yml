name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on KVM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          port: ${{ secrets.KVM_PORT }}
          script: |
            set -e
            cd /var/www/html/festa-junina
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose exec -T server node -e "fetch('http://localhost:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
