services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      ADMIN_PIN: "${ADMIN_PIN:-1234}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-12h}"
    volumes:
      - queue-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  queue-data:


